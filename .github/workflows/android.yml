name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Keep debug signing identity between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fuelradar-debug-keystore-v1
      - name: Compile, test and lint
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelRadar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: app/build/reports/
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash ./gradlew --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/es.fuelradar.app/files/fuelradar-home.png app/build/reports/androidTests/fuelradar-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
