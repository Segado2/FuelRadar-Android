name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUELRADAR_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Keep debug signing identity between builds
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: fuelradar-debug-keystore-v2
      - name: Ensure cached debug signing key exists
        run: |
          mkdir -p .ci-signing
          if [ ! -s "$FUELRADAR_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$FUELRADAR_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$FUELRADAR_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey
      - name: Compile, test and lint
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelRadar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: app/build/reports/
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FUELRADAR_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - name: Verify signing key persisted for subsequent builds
        uses: actions/cache/restore@v4
        with:
          path: .ci-signing/debug.keystore
          key: fuelradar-debug-keystore-v2
          fail-on-cache-miss: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash ./gradlew --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Download/fuelradar-home.png app/build/reports/androidTests/fuelradar-home.png
            adb pull /sdcard/Download/fuelradar-rewards.png app/build/reports/androidTests/fuelradar-rewards.png
            adb pull /sdcard/Download/fuelradar-wallet.png app/build/reports/androidTests/fuelradar-wallet.png
            adb pull /sdcard/Download/fuelradar-settings.png app/build/reports/androidTests/fuelradar-settings.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/

